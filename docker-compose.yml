services:
    web:
        build: .
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/app
        ports:
            - "8000:8000"
        environment:
            - POSTGRESQL_USERNAME=user
            - POSTGRESQL_PASSWORD=password
            - POSTGRESQL_DATABASE=barber-top
            - DB_HOST=postgres
        depends_on:
            - postgres
    postgres:
        image: bitnami/postgresql:latest
        ports:
            - "5432:5432"
        environment:
            POSTGRESQL_USERNAME: user
            POSTGRESQL_PASSWORD: password
            POSTGRESQL_DATABASE: barber-top
        volumes:
            - postgres_data:/bitnami/postgresql
volumes:
    postgres_data:
