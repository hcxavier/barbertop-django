<header class="top-bar">
    <div class="dropdown">
        <div class="user-profile" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="avatar">
                {% if barbershop.imageUrl %}
                    <img src="{{ barbershop.imageUrl.url }}" alt="Avatar"
                        style="width: 100%; height: 100%; border-radius: 50%;">
                {% else %}
                    <img src="https://api.dicebear.com/7.x/initials/svg?seed={{ barbershop.name }}" alt="Avatar"
                        style="width: 100%; height: 100%; border-radius: 50%;">
                {% endif %}
            </div>
            <span style="font-size: 0.9rem; font-weight: 500;">{{ barbershop.name }}</span>
            <i class="bi bi-chevron-down ms-2" style="font-size: 0.8rem; color: var(--text-muted);"></i>
        </div>

        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" aria-labelledby="dropdownMenuLink" style="background-color: #18181b; border-color: #29292e;">
            <li>
                <a class="dropdown-item d-flex align-items-center gap-2" href="#">
                    <i class="bi bi-person"></i> Meu Perfil
                </a>
            </li>
            <li><hr class="dropdown-divider" style="border-color: #29292e;"></li>
            <li>
                <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="{% url 'users:logout' %}">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </a>
            </li>
        </ul>
    </div>
</header>
