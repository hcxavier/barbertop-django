{% extends "base.html" %}
{% load static %}

{% block title %}Página não encontrada - 404{% endblock %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 60vh;">
    <h1 class="display-1 fw-bold text-white" style="font-size: 8rem;">404</h1>
    <h2 class="fs-2 fw-bold text-white mb-3">Página não encontrada</h2>
    <p class="text-muted text-center mb-5" style="max-width: 500px;">
        A página que você está tentando acessar não existe, foi movida ou está temporariamente indisponível.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2 fw-bold" style="background-color: #8257e5; border: none;">
        <i class="bi bi-arrow-left me-2"></i>Voltar para o Início
    </a>
</div>
{% endblock %}
