{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Barber Top{% endblock %}</title>
        
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

        {% block extra_head %}{% endblock %}
    </head>
    <body class="{% block body_class %}body-pad-top{% endblock %}">
        <!-- Mobile Header -->
        <div class="mobile-header d-md-none d-flex justify-content-between align-items-center px-3 py-2 shadow-sm">
            <button class="btn btn-link text-white p-0" id="sidebarToggle">
                <i class="bi bi-list fs-1"></i>
            </button>
            <span class="fw-bold fs-5">BarberTop</span>
            <div style="width: 40px;"></div>
        </div>

        <div class="mobile-overlay" id="mobileOverlay"></div>

        {% block sidebar %} {% include 'includes/sidebar.html' %} {% endblock %}

        {% block content %}{% endblock %}

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const sidebar = document.querySelector('.sidebar');
                const toggleBtn = document.getElementById('sidebarToggle');
                const overlay = document.getElementById('mobileOverlay');
                const closeBtns = document.querySelectorAll('.sidebar-close-btn'); // Will be added to sidebar

                function toggleSidebar() {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                    document.body.style.overflow = sidebar.classList.contains('show') ? 'hidden' : '';
                }

                if(toggleBtn) {
                    toggleBtn.addEventListener('click', toggleSidebar);
                }

                if(overlay) {
                    overlay.addEventListener('click', toggleSidebar);
                }
                
                closeBtns.forEach(btn => {
                    btn.addEventListener('click', toggleSidebar);
                });
            });
        </script>
    </body>
</html>
